name: check

on:
  push:
  pull_request:

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify engine submodule pins
        run: bash scripts/check-pins.sh

  rust-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Engine adapter unit tests
        working-directory: src-tauri
        run: cargo test --lib
        # Sidecar binaries are not in CI; ECLIPSE_SMOKE is unset so the spawn test is skipped.
